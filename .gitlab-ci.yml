# GitLab CI/CD Pipeline - Separate Frontend/Backend Branches
# Backend branch: backend-oms_pdm-microservice
# Frontend branch: frontend
# Images are stored in GitLab Container Registry for local testing

stages:
  - test
  - build
  - push
  - deploy

variables:
  # GitLab Container Registry
  # Registry path: registry.gitlab.com/vinodoguboyina/cmf
  BACKEND_IMAGE: registry.gitlab.com/vinodoguboyina/cmf/backend:$CI_COMMIT_SHORT_SHA
  FRONTEND_IMAGE: registry.gitlab.com/vinodoguboyina/cmf/frontend:$CI_COMMIT_SHORT_SHA
  BACKEND_IMAGE_LATEST: registry.gitlab.com/vinodoguboyina/cmf/backend:latest
  FRONTEND_IMAGE_LATEST: registry.gitlab.com/vinodoguboyina/cmf/frontend:latest

# Backend Tests (only runs on backend branch)
test_backend:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - echo "Running backend tests..."
    # Add your backend test command here
    # - python -m pytest tests/
    - echo "Backend tests passed (placeholder - add actual tests)"
  only:
    - backend-oms_pdm-microservice
    - merge_requests

# Frontend Tests (only runs on frontend branch)
test_frontend:
  stage: test
  image: node:22-alpine
  before_script:
    - npm ci --legacy-peer-deps
  script:
    - echo "Running frontend tests..."
    # Add your frontend test command here
    # - npm run test
    - npm run lint
    - echo "Frontend tests passed (placeholder - add actual tests)"
  only:
    - frontend
    - merge_requests

# Build Backend Docker Image (only on backend branch)
build_backend:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $BACKEND_IMAGE -t $BACKEND_IMAGE_LATEST .
    - echo "Backend image built successfully"
  only:
    - backend-oms_pdm-microservice
  needs:
    - test_backend

# Build Frontend Docker Image (only on frontend branch)
build_frontend:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $FRONTEND_IMAGE -t $FRONTEND_IMAGE_LATEST .
    - echo "Frontend image built successfully"
  only:
    - frontend
  needs:
    - test_frontend

# Push Backend Image to GitLab Registry
push_backend:
  stage: push
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker push $BACKEND_IMAGE
    - docker push $BACKEND_IMAGE_LATEST
    - echo "Backend image pushed to GitLab Registry"
    - echo "Image: $BACKEND_IMAGE"
    - echo "Latest: $BACKEND_IMAGE_LATEST"
  only:
    - backend-oms_pdm-microservice
  needs:
    - build_backend

# Push Frontend Image to GitLab Registry
push_frontend:
  stage: push
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker push $FRONTEND_IMAGE
    - docker push $FRONTEND_IMAGE_LATEST
    - echo "Frontend image pushed to GitLab Registry"
    - echo "Image: $FRONTEND_IMAGE"
    - echo "Latest: $FRONTEND_IMAGE_LATEST"
  only:
    - frontend
  needs:
    - build_frontend

# Deploy to Docker Desktop Kubernetes (manual trigger)
# NOTE: This requires a self-hosted GitLab runner on your local machine
# See DOCKER_DESKTOP_K8S_SETUP.md for setup instructions
deploy_backend:
  stage: deploy
  image: bitnami/kubectl:latest
  tags:
    - docker-desktop
    - kubernetes
  before_script:
    - kubectl config use-context docker-desktop
  script:
    - echo "Deploying backend to Docker Desktop Kubernetes..."
    - kubectl apply -f k8s/backend-deployment.yaml
    - kubectl apply -f k8s/backend-service.yaml
    - kubectl rollout restart deployment cmf-backend
    - echo "Backend deployment completed successfully"
  only:
    - backend-oms_pdm-microservice
  needs:
    - push_backend
  when: manual

deploy_frontend:
  stage: deploy
  image: bitnami/kubectl:latest
  tags:
    - docker-desktop
    - kubernetes
  before_script:
    - kubectl config use-context docker-desktop
  script:
    - echo "Deploying frontend to Docker Desktop Kubernetes..."
    - kubectl apply -f k8s/frontend-deployment.yaml
    - kubectl apply -f k8s/frontend-service.yaml
    - kubectl rollout restart deployment cmf-frontend
    - echo "Frontend deployment completed successfully"
  only:
    - frontend
  needs:
    - push_frontend
  when: manual
